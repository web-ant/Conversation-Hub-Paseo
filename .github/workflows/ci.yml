name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync-info
      - run: git diff --exit-code -- client/plugin-info-content.ts client/plugin-icon-data.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
